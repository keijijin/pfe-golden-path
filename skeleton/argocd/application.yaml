apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: pfe-lab
spec:
  project: default
  source:
    repoURL: https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pfe-lab/guardrails: enabled
        argocd.argoproj.io/managed-by: pfe-lab
